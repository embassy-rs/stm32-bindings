[package]
name = "stm32-bindings-gen"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"


[dependencies]
regex = "1.12.3"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.150"
proc-macro2 = "1.0.106"
bindgen = "0.72.1"
tempfile = "3.27.0"
clap = { version = "4.6", features = ["derive"] }
syn = { version = "2.0.117", features = ["full", "fold"] }
quote = "1.0.45"
lazy-regex = "3.6.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
