name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: ⚡ Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo
      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Set permissions
        run: chmod +x d
      - name: Load sources
        run: |
          ./d download-all
          ./d fetch-nema-gfx
      - name: Build thread
        run: ./d build-thread
      - name: Install Rust targets
        run: rustup target add thumbv8m.main-none-eabihf thumbv7em-none-eabi thumbv6m-none-eabi
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run build
        run: cargo run --release --bin stm32-bindings-gen
      - name: Check generated crate targets
        run: |
          cd build/stm32-bindings
          for target in thumbv7em-none-eabi thumbv6m-none-eabi thumbv8m.main-none-eabihf; do
            echo "Checking target $target"
            cargo check --target "$target" --no-default-features --features pac
          done
      - name: Check NemaGFX bindings
        run: |
          cd build/stm32-bindings
          cargo check --target thumbv8m.main-none-eabihf --no-default-features --features nema_gfx,lib_nemagfx_cortex_m55_float_abi_hard
          cargo check --target thumbv8m.main-none-eabihf --no-default-features --features nema_gfx,lib_nemagfx_cortex_m33_revc_float_abi_hard
          cargo check --target thumbv7em-none-eabihf --no-default-features --features nema_gfx,lib_nemagfx_cortex_m7_float_abi_hard
      - name: Build NemaGFX HAL and smoke example
        run: |
          cargo build -p nema-gfx-hal
          cd examples/nema-gfx-smoke
          cargo build
      - name: Run package build
        run: |
          cd build/stm32-bindings
          cargo package --target thumbv8m.main-none-eabihf
      - name: Upload package build
        uses: actions/upload-artifact@v5
        with:
          name: crate
          path: build/stm32-bindings/target/package/*.crate
      - name: Upload thread lib
        uses: actions/upload-artifact@v5
        with:
          name: thread-lib
          path: build/thread/build/*.a

